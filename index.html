<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkTimeTracker</title>
  </head>
  <body>
    <!--
      The window is never blank: this spinner is replaced by the application as
      soon as it mounts, and by the boot error panel when it cannot.
    -->
    <div id="root">
      <div class="boot-screen" data-boot-screen role="status" aria-live="polite">
        <span class="boot-spinner"></span>
        <p class="boot-text">Starting WorkTimeTracker…</p>
      </div>
    </div>
    <script type="module" src="/src/boot-status.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
