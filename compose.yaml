services:
  development:
    build:
      context: .
      dockerfile: Containerfile
    init: true
    stdin_open: true
    tty: true
    ports:
      - "1420:1420"
    environment:
      XDG_DATA_HOME: /root/.local/share
      # `localhost` in the host-native URL would name this container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-worktimetracker}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-worktimetracker}
    volumes:
      - .:/workspace:z
      - node_modules:/workspace/node_modules
      - cargo_registry:/root/.cargo/registry
      - cargo_target:/workspace/src-tauri/target
      - app_data:/root/.local/share
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worktimetracker}
      POSTGRES_USER: ${POSTGRES_USER:-worktimetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images place PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worktimetracker} -d ${POSTGRES_DB:-worktimetracker}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app_data:
  node_modules:
  cargo_registry:
  cargo_target:
  postgres_data:
