name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      untrusted_checks:
        description: 'Run checks for untrusted dependency updates without repository secrets.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  # Detects which parts of the tree changed so PRs that only touch the
  # frontend (or only touch src-tauri) can skip the unrelated job. Pushes to
  # main and manual runs always run everything, so caches stay warm and main
  # always gets full signal.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed areas
        id: filter
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "origin/$GITHUB_BASE_REF...$GITHUB_SHA")
          if [[ -n "$changed_files" ]] && grep -qv '^src-tauri/' <<< "$changed_files"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(src-tauri/|package-lock\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast, cheap checks that all run in a single job since none of them takes
  # more than a few seconds - splitting these further would only add
  # checkout/setup overhead without shortening the wall clock.
  lint-typecheck-build:
    name: lint, typecheck, architecture, build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run licenses:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm run build

  # The slowest frontend step (~110s, dominated by the jsdom test
  # environment), so it gets its own job to run in parallel with the fast
  # checks and the rust/e2e jobs instead of serializing after them.
  test:
    name: unit tests (coverage)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Untrusted dispatches run dependency code without repository secrets.
      CODECOV_TOKEN: ${{ inputs.untrusted_checks != true && secrets.CODECOV_TOKEN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run test:coverage
      # Forks and Dependabot runs do not get repository secrets, so the upload
      # is skipped there instead of failing the job on an empty token. A failed
      # test run writes no report, so the upload is skipped there as well and
      # the job reports the test failure alone.
      - name: Upload coverage reports to Codecov
        if: ${{ success() && inputs.untrusted_checks != true && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true

  rust:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The Postgres tests are the only coverage of the constraints and queries
    # of the single native backend, so they run against a throwaway database
    # here instead of being skipped.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Throwaway database that is only reachable from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: worktimetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worktimetracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: host=localhost port=5432 user=worktimetracker_app dbname=worktimetracker
      # Turns an unreachable database into a failure instead of a skip.
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node is only needed for the npm steps below, which are all skipped on
      # pull requests, so the dependency install is skipped there too.
      - uses: ./.github/actions/setup-node
        if: github.event_name != 'pull_request'
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      # The tests create and drop databases, so this job must never be
      # pointed at anything but its own throwaway service container.
      - run: node scripts/assert-local-database.mjs
      # The bootstrap role of the service container is a superuser and would
      # bypass the row level security policies of the schema, so the tests
      # connect as the same kind of role as the application does.
      - name: Create the application role
        run: |
          psql "host=localhost port=5432 user=postgres dbname=worktimetracker" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE worktimetracker_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE CREATEDB" \
            -c "GRANT ALL PRIVILEGES ON DATABASE worktimetracker TO worktimetracker_app"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # Runs in the lint/build job for any change that can affect licenses
      # (package-lock.json is not under src-tauri/), so it is skipped here on
      # pull requests. Native release builds run in the cold-start matrix below.
      - run: npm run licenses:check
        if: github.event_name != 'pull_request'

  native-startup:
    name: native cold start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-native-startup-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-native-startup-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev xvfb
      - name: Test native measurement harness
        run: npx vitest run scripts/check-native-startup.test.mjs
      - name: Build release application (Linux and Windows)
        if: runner.os != 'macOS'
        run: npm run tauri build -- --no-bundle
      - name: Build release application bundle (macOS)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app
      - name: Measure fresh native process (Linux)
        if: runner.os == 'Linux'
        env:
          # Xvfb has no DRI3 device for WebKit's DMA-BUF renderer.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a node scripts/check-native-startup.mjs
      - name: Measure fresh native process (macOS and Windows)
        if: runner.os != 'Linux'
        run: node scripts/check-native-startup.mjs

  end-to-end:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Single required status check that branch protection can depend on: it
  # succeeds when every non-skipped job above succeeded, so PRs that skip the
  # rust or web jobs (via path filtering) aren't blocked by a "missing" check.
  ci-success:
    name: CI success
    if: always()
    needs: [changes, lint-typecheck-build, test, rust, end-to-end, native-startup]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded (or were skipped)."
