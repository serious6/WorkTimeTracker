name: Fuzz

# Fuzzing explores input no example based test was written for, so it runs on a
# schedule, for changes to the backend or the targets themselves, and as a gate
# of the release pipeline. Findings are reproduced locally with the crash
# artifact.
on:
  # `workflow_call` lets the release pipeline reuse these steps instead of
  # copying them, with a budget of its own.
  workflow_call:
    inputs:
      fuzz_seconds:
        required: false
        type: string
        default: '600'
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Mondays, 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the caller's name for a called run, so the prefix is
  # what keeps this run out of the group its caller already holds - sharing it
  # would make the caller wait for a job that waits for the caller.
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Seconds each target runs. A pull request gets a smoke run, the weekly run
  # and a manual one search longer, and a caller sets its own budget.
  # A caller's budget wins: `github.event_name` is the one of the caller, so it
  # says nothing about a called run. `inputs` is empty for every trigger but
  # `workflow_call`, so the other triggers fall through to their own value.
  FUZZ_SECONDS: ${{ inputs.fuzz_seconds || (github.event_name == 'pull_request' && '60') || '600' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # One job per target: they search in parallel, so a longer budget per
    # target does not stretch the run that waits for them.
    strategy:
      fail-fast: false
      matrix:
        target: [redact, database_url, save_input, portable_settings]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz builds the targets with the sanitizer and coverage
      # instrumentation of the nightly compiler.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/fuzz
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: src-tauri/fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
      # The input that reproduces a finding is the only thing needed to turn it
      # into a failing unit test, so it must survive the run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: src-tauri/fuzz/artifacts/
          retention-days: 7
