name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<version from tauri.conf.json>)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: false
        type: boolean
      migrate_production_database:
        description: 'Apply the schema migrations to the production database'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release version is consistent
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./package.json').version")
          cargo=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"(.*)\"$/m)[1]")
          if [ "$config" != "$cargo" ] || [ "$config" != "$package" ]; then
            echo "::error::Version mismatch (tauri.conf.json $config, Cargo.toml $cargo, package.json $package). The version stored in the local database comes from Cargo.toml and must match the release."
            exit 1
          fi
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "v$config" ]; then
            echo "::error::Release tag $INPUT_TAG does not match the configured version v$config."
            exit 1
          fi
          echo "Releasing version $config"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run architecture:check
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefer-offline
      # The tests must never reach a deployed database.
      - run: node scripts/assert-local-database.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run licenses:check

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Dynamic analysis of every proposed production release, as the OpenSSF Best
  # Practices criterion `dynamic_analysis` asks for. It reuses the `Fuzz`
  # workflow so the steps exist once; 900 seconds per target is affordable
  # because the targets search in parallel. It runs beside the bundles and the
  # migration; `release` is the single gate.
  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      fuzz_seconds: '900'
    permissions:
      contents: read

  # No `fuzz` in `needs`: the bundles consume nothing from it, so they build
  # while it searches instead of idling for it.
  bundle:
    needs: [version, web, rust, end-to-end]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x86_64
          - platform: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --prefer-offline
      - run: npm run tauri build
      # The installers need administrator rights, so the same build is also
      # shipped as an archive that runs from a folder of the user profile. It
      # carries the documented example configuration, never a connection.
      - name: Assemble the portable archive
        shell: bash
        run: |
          mkdir -p portable/staging
          cp portable/WorkTimeTracker.env.example portable/staging/
          if [ "$RUNNER_OS" = "Windows" ]; then
            for candidate in WorkTimeTracker.exe work-time-tracker.exe; do
              if [ -f "src-tauri/target/release/$candidate" ]; then
                cp "src-tauri/target/release/$candidate" portable/staging/WorkTimeTracker.exe
              fi
            done
            test -f portable/staging/WorkTimeTracker.exe || {
              echo "::error::the build produced no portable executable"
              exit 1
            }
          else
            cp -R src-tauri/target/release/bundle/macos/WorkTimeTracker.app portable/staging/
          fi
      - name: Verify the portable archive carries no configured connection
        run: npm run portable:assert-env -- portable/staging
      - name: Pack the portable archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path portable/staging/* -DestinationPath portable/WorkTimeTracker-portable.zip
      # `ditto` keeps the symbolic links and the executable bits of the
      # application bundle, which a plain `zip` of the folder would lose.
      - name: Pack the portable archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc portable/staging portable/WorkTimeTracker-portable.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            portable/WorkTimeTracker-portable.zip
          if-no-files-found: error
          retention-days: 7

  # The only job that reaches the production database. Its dedicated secrets
  # live in the protected `production-migration` environment, separate from the
  # application's credentials, and it is opt-in: a shared database is migrated
  # deliberately, never by an installation that starts. It waits for the
  # bundles, so the shared schema is only changed once every installer of the
  # release exists. The values are never printed or bundled. `fuzz` does not
  # hold it back; `release` alone gates a run with a fuzz finding.
  migrate-production-database:
    if: ${{ inputs.migrate_production_database }}
    needs: [version, bundle]
    runs-on: ubuntu-latest
    environment: production-migration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Write the pinned certificate authority
        env:
          ROOT_CERT: ${{ secrets.SUPABASE_MIGRATION_DB_ROOT_CERT }}
        run: |
          if [ -z "$ROOT_CERT" ]; then
            echo "::error::The secret SUPABASE_MIGRATION_DB_ROOT_CERT is empty; a remote database is only reachable with the certificate authority to verify it against."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ROOT_CERT" > "$RUNNER_TEMP/database-ca.pem"
      # Supabase direct hosts use IPv6, which GitHub-hosted runners cannot
      # route. Diagnose that mismatch before the migration obscures it.
      - name: Check database reachability
        env:
          HOST: ${{ secrets.SUPABASE_MIGRATION_DB_HOST }}
          PORT: ${{ secrets.SUPABASE_MIGRATION_DB_PORT }}
        run: |
          if [ -z "$HOST" ] || [ -z "$PORT" ]; then
            echo "::error::SUPABASE_MIGRATION_DB_HOST and SUPABASE_MIGRATION_DB_PORT must be configured for the reachability check."
            exit 1
          fi
          if ! getent ahostsv4 "$HOST" >/dev/null 2>&1; then
            echo "::warning::SUPABASE_MIGRATION_DB_HOST has no IPv4 address. GitHub-hosted runners cannot reach IPv6-only Supabase direct connections; use the session-mode pooler host instead."
          fi
          if ! timeout 5 bash -c 'exec 3<>"/dev/tcp/${HOST}/${PORT}"' 2>/dev/null; then
            echo "::error::The production database is not reachable over TCP using SUPABASE_MIGRATION_DB_HOST and SUPABASE_MIGRATION_DB_PORT; check the session-mode pooler endpoint, project state, and network restrictions."
            exit 1
          fi
      - name: Apply the migrations
        env:
          WORK_TIME_TRACKER_ENV: production
          WORK_TIME_TRACKER_DB_MIGRATE: 'true'
          # The dedicated migration parts are assembled with
          # sslmode=verify-full. Supabase migrations use the IPv4-capable
          # session-mode pooler
          # (aws-0-<region>.pooler.supabase.com, port 5432, user
          # <application-role>.<project-ref>, so the migrated objects belong to
          # the role the installations connect as); transaction mode on port
          # 6543 is not suitable for migrations.
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_MIGRATION_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_MIGRATION_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_MIGRATION_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_MIGRATION_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_MIGRATION_DB_NAME }}
          SUPABASE_DB_ROOT_CERT: ${{ runner.temp }}/database-ca.pem
        run: cargo run --manifest-path src-tauri/Cargo.toml --example migrate

  release:
    needs: [bundle, fuzz, migrate-production-database]
    # `bundle` and `fuzz` must have succeeded; the migration is skipped unless
    # it was asked for, and only a successful or a skipped one may be released
    # after.
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.fuzz.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs['migrate-production-database'].result) }}
    runs-on: ubuntu-latest
    # Publishing a release is a production change: it waits for a reviewer of
    # the protected `production` environment before any asset becomes public.
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}
    permissions:
      contents: write
    steps:
      # The release notes list the commits since the previous tag, so the full
      # history and the tags have to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${INPUT_TAG:-v$version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          existing_sha=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq '.sha' 2>/dev/null || true)
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already points to $existing_sha, not the current commit $GITHUB_SHA. Refusing to publish and overwrite an unrelated release."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: false
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            platform=$(basename "$(echo "$file" | cut -d/ -f2)" | sed 's/^bundle-//')
            cp "$file" "release/${platform}-$(basename "$file")"
          done
          ls -l release
      # The notes are a written summary from CHANGELOG.md, never the raw output
      # of a version control log; the commits are appended below it. The step
      # fails when the released version has no changelog section.
      - name: Build release notes
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          file="$RUNNER_TEMP/release-notes.md"
          node scripts/build-release-notes.mjs --version "$VERSION" --tag "$TAG" --output "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          args=(--title "$TAG" --target "$GITHUB_SHA" --notes-file "$NOTES_FILE")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run must not leave the notes of the previous attempt behind.
            gh release edit "$TAG" --prerelease="$PRERELEASE" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${args[@]}"
          fi
