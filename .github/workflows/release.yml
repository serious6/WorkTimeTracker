name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<version from tauri.conf.json>)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: false
        type: boolean
      migrate_production_database:
        description: 'Apply the schema migrations to the production database'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the release version is consistent
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./package.json').version")
          cargo=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"(.*)\"$/m)[1]")
          if [ "$config" != "$cargo" ] || [ "$config" != "$package" ]; then
            echo "::error::Version mismatch (tauri.conf.json $config, Cargo.toml $cargo, package.json $package). The version stored in the local database comes from Cargo.toml and must match the release."
            exit 1
          fi
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "v$config" ]; then
            echo "::error::Release tag $INPUT_TAG does not match the configured version v$config."
            exit 1
          fi
          echo "Releasing version $config"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run architecture:check
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefer-offline
      # The tests must never reach a deployed database.
      - run: node scripts/assert-local-database.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run licenses:check

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bundle:
    needs: [version, web, rust, end-to-end]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x86_64
          - platform: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --prefer-offline
      - run: npm run tauri build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 7

  # The only job that reaches the production database. Its secrets live in the
  # protected `production` environment, so no other job of this workflow or of
  # any other can read them, and it is opt-in: a shared database is migrated
  # deliberately, never by an installation that starts. The values are never
  # printed, and the bundles built above contain none of them - a deployment
  # provides them to the application at run time.
  migrate-production-database:
    if: ${{ inputs.migrate_production_database }}
    needs: [version, web, rust, end-to-end]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Write the pinned certificate authority
        env:
          ROOT_CERT: ${{ secrets.SUPABASE_DB_ROOT_CERT }}
        run: |
          if [ -z "$ROOT_CERT" ]; then
            echo "::error::The secret SUPABASE_DB_ROOT_CERT is empty; a remote database is only reachable with the certificate authority to verify it against."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ROOT_CERT" > "$RUNNER_TEMP/database-ca.pem"
      - name: Apply the migrations
        env:
          WORK_TIME_TRACKER_ENV: production
          WORK_TIME_TRACKER_DB_MIGRATE: 'true'
          # A complete connection string wins; otherwise the parts below are
          # assembled into one, always with sslmode=verify-full.
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_ROOT_CERT: ${{ runner.temp }}/database-ca.pem
        run: cargo run --manifest-path src-tauri/Cargo.toml --example migrate

  release:
    needs: [bundle, migrate-production-database]
    # `bundle` must have succeeded; the migration is skipped unless it was
    # asked for, but a failed one must not be followed by a release.
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs['migrate-production-database'].result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${INPUT_TAG:-v$version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          existing_sha=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq '.sha' 2>/dev/null || true)
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already points to $existing_sha, not the current commit $GITHUB_SHA. Refusing to publish and overwrite an unrelated release."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: false
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            platform=$(basename "$(echo "$file" | cut -d/ -f2)" | sed 's/^bundle-//')
            cp "$file" "release/${platform}-$(basename "$file")"
          done
          ls -l release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "$TAG" --target "$GITHUB_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease="$PRERELEASE"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${args[@]}"
          fi
