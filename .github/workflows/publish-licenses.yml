name: Publish license notices

on:
  workflow_run:
    workflows: ["Update license notices"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Resolve current writable target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          ;(async () => {
            const { workflow_run: run } = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
            const repository = process.env.REPOSITORY
            const output = fs.openSync(process.env.GITHUB_OUTPUT, 'a')
            const skip = (reason) => {
              console.log(reason)
              fs.closeSync(output)
              process.exit(0)
            }

            const runResponse = await fetch(
              `https://api.github.com/repos/${repository}/actions/runs/${run.id}`,
              {
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: 'Bearer ' + process.env.GH_TOKEN,
                  'x-github-api-version': '2022-11-28',
                },
              },
            )
            if (!runResponse.ok) skip(`Could not resolve the source workflow (${runResponse.status}).`)
            const runDetails = await runResponse.json()
            if (
              run.name !== 'Update license notices' ||
              runDetails.name !== run.name ||
              runDetails.path !== '.github/workflows/licenses.yml'
            ) {
              skip('Ignoring a run that did not originate from the license generator workflow.')
            }

            let branch
            let sha = run.head_sha
            if (run.event === 'push') {
              if (run.head_branch !== 'main' || run.head_repository?.full_name !== repository) {
                skip('Ignoring a push outside the repository main branch.')
              }

              const response = await fetch(`https://api.github.com/repos/${repository}/branches/main`, {
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: 'Bearer ' + process.env.GH_TOKEN,
                  'x-github-api-version': '2022-11-28',
                },
              })
              if (!response.ok) skip(`Could not resolve the current main branch (${response.status}).`)
              const currentBranch = await response.json()
              if (currentBranch.commit?.sha !== sha) skip('The main branch advanced; ignoring stale notices.')
              branch = 'main'
            } else {
              if (run.head_repository?.full_name !== repository) {
                skip('Fork pull requests cannot be updated.')
              }

              const response = await fetch(
                `https://api.github.com/repos/${repository}/commits/${sha}/pulls`,
                {
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: 'Bearer ' + process.env.GH_TOKEN,
                    'x-github-api-version': '2022-11-28',
                  },
                },
              )
              if (!response.ok) skip(`Could not resolve the current pull request (${response.status}).`)

              const pullRequests = await response.json()
              const pullRequest = pullRequests.find(
                (candidate) =>
                  candidate.state === 'open' &&
                  candidate.head?.sha === sha &&
                  candidate.head?.ref === run.head_branch &&
                  candidate.head?.repo?.full_name === repository,
              )
              if (!pullRequest) skip('The pull request head changed or is no longer open.')

              branch = pullRequest.head.ref
              sha = pullRequest.head.sha
            }

            fs.writeSync(output, `branch=${branch}\nsha=${sha}\n`)
            fs.closeSync(output)
          })().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Download generated license notices
        if: steps.target.outputs.branch != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: license-notices
          path: ${{ runner.temp }}/license-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate generated license notices
        if: steps.target.outputs.branch != ''
        env:
          LICENSE_FILE: ${{ runner.temp }}/license-artifact/licenses.json
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const file = process.env.LICENSE_FILE
          const stat = fs.lstatSync(file)
          if (!stat.isFile() || stat.size > 10 * 1024 * 1024) {
            throw new Error('Generated license notice artifact is not a regular file of an acceptable size.')
          }

          const data = JSON.parse(fs.readFileSync(file, 'utf8'))
          const hasExactKeys = (value, keys) =>
            value !== null &&
            typeof value === 'object' &&
            !Array.isArray(value) &&
            JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort())

          if (
            !hasExactKeys(data, ['generatedAt', 'appVersion', 'npm', 'rust']) ||
            typeof data.generatedAt !== 'string' ||
            Number.isNaN(Date.parse(data.generatedAt)) ||
            typeof data.appVersion !== 'string' ||
            !Array.isArray(data.npm) ||
            !Array.isArray(data.rust) ||
            data.npm.length + data.rust.length > 10_000
          ) {
            throw new Error('Generated license notice artifact has an invalid structure.')
          }

          for (const entry of [...data.npm, ...data.rust]) {
            if (
              !hasExactKeys(entry, ['name', 'version', 'license', 'publisher', 'repository', 'licenseText']) ||
              typeof entry.name !== 'string' ||
              typeof entry.version !== 'string' ||
              typeof entry.license !== 'string' ||
              (entry.publisher !== null && typeof entry.publisher !== 'string') ||
              (entry.repository !== null && typeof entry.repository !== 'string') ||
              typeof entry.licenseText !== 'string'
            ) {
              throw new Error('Generated license notice artifact has an invalid package entry.')
            }
          }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.branch != ''
        with:
          ref: main
          persist-credentials: false
      - name: Prepare the generated commit
        id: license-diff
        if: steps.target.outputs.branch != ''
        env:
          LICENSE_FILE: ${{ runner.temp }}/license-artifact/licenses.json
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER" \
            git fetch --no-tags origin "refs/heads/$BRANCH_NAME"
          CURRENT_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$CURRENT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::notice::The target branch advanced; ignoring stale notices."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTICE_BLOB="$(git hash-object -w "$LICENSE_FILE")"
          if [[ "$(git rev-parse "$EXPECTED_SHA:src/data/licenses.json")" == "$NOTICE_BLOB" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git read-tree "$EXPECTED_SHA"
          git update-index --add --cacheinfo 100644 "$NOTICE_BLOB" src/data/licenses.json
          TREE="$(git write-tree)"
          COMMIT="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$TREE" -p "$EXPECTED_SHA" -m 'chore: update license notices')"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Mint the license update app token
        id: app-token
        if: steps.license-diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Push generated license notices
        if: steps.license-diff.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
          COMMIT: ${{ steps.license-diff.outputs.commit }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 --wrap=0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER" \
            git push origin "$COMMIT:refs/heads/$BRANCH_NAME"
