name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly published queries are applied to code that is
    # not being touched by pull requests.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same approach as ci.yml: a documentation-only pull request skips the
  # analysis rather than being excluded by `paths-ignore`, so the check still
  # reports a result and can safely be required. The filter is deliberately
  # narrow - only a change that touches nothing but Markdown is skipped, because
  # docs/site/ ships real HTML and JavaScript. Pushes to main and the scheduled
  # runs always analyse everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

  analyze:
    name: analyze (${{ matrix.language }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust support is a CodeQL public preview; it is analysed with the same
        # build-mode as the frontend because the extractor does not need a
        # compiled target.
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
