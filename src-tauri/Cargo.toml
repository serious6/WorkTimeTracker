[package]
name = "work-time-tracker"
version = "0.1.0"
description = "A local-first desktop work time tracker"
authors = ["serious6"]
license = "MIT"
repository = "https://github.com/serious6/WorkTimeTracker"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "work_time_tracker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The feature list stays empty on purpose: `tauri/devtools` would compile the
# web inspector into the shipped binary, where it would expose the session id
# and every IPC payload. Without it tauri gates the inspector, its context menu
# entry and `open_devtools` on `cfg(debug_assertions)`, so `tauri dev` keeps
# them and `tauri build` does not. `devtools_stay_out_of_a_release_build` in
# `src/lib.rs` fails when this list gains the feature.
tauri = { version = "2.11.5", features = [] }
argon2 = { version = "0.5", features = ["std"] }
postgres = "0.19.14"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
