[package]
name = "work-time-tracker"
version = "0.1.0"
description = "A local-first desktop work time tracker"
authors = ["serious6"]
license = "MIT"
repository = "https://github.com/serious6/WorkTimeTracker"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "work_time_tracker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The feature list stays empty on purpose: `tauri/devtools` would compile the
# web inspector into the shipped binary, where it would expose the session id
# and every IPC payload. Without it tauri gates the inspector, its context menu
# entry and `open_devtools` on `debug_assertions`, so `tauri dev` keeps them and
# `tauri build` does not. `devtools_stay_out_of_a_release_build` in `src/lib.rs`
# fails when this list gains the feature or a profile turns `debug-assertions`
# back on.
tauri = { version = "2.11.5", features = [] }
argon2 = { version = "0.5", features = ["std"] }
postgres = "0.19.14"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
tauri-plugin-dialog = "2.7.3"

# The credential store of the user account holds the database secrets of a
# portable installation, so the folder the application runs from carries none.
# Only the platforms a portable archive is shipped for link a store, and both
# work without administrator rights: the Windows Credential Manager, which
# protects the value with DPAPI in the scope of the current user, and the macOS
# Keychain. On every other platform `portable.rs` reports the secret as
# unavailable instead of leaving it readable in the folder.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring-core = "1.0.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
